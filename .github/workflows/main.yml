
name: SALIK APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create SALIK project
        run: |
          mkdir -p app/src/main/java/com/salik/app
          mkdir -p app/src/main

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SALIK"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.salik.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.salik.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="SALIK"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/salik/app/MainActivity.java <<'EOF'
          package com.salik.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.widget.TextView;
          import android.widget.LinearLayout;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(17);
                  layout.setBackgroundColor(Color.rgb(15, 15, 25));

                  TextView title = new TextView(this);
                  title.setText("SALIK");
                  title.setTextSize(38);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(17);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Новый сезон начинается...");
                  subtitle.setTextSize(18);
                  subtitle.setTextColor(Color.LTGRAY);
                  subtitle.setGravity(17);

                  layout.addView(title);
                  layout.addView(subtitle);
                  setContentView(layout);
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SALIK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
